services:
  hackathon-backend:
    image: ghcr.io/intriqathon2027/hackathon-backend:latest
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      OAUTH2_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH2_GITHUB_CLIENT_SECRET: ${OAUTH2_GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: https://${DOMAIN}/api/auth/github/callback

      OAUTH2_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      OAUTH2_DISCORD_CLIENT_SECRET: ${OAUTH2_DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: https://${DOMAIN}/api/auth/discord/callback

      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}

      BASE_URL: https://${DOMAIN}
      ALLOWED_HOSTS: ${DOMAIN}
      HOST: 0.0.0.0 # Ensure listening on all interfaces
    restart: always

  hackathon-frontend:
    image: ghcr.io/intriqathon2027/hackathon-front:latest
    expose:
      - "80"
    environment:
      VITE_API_URL: https://${DOMAIN}
      VITE_SUPABASE_URL: ${SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}

      VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      VITE_DISCORD_REDIRECT_URI: https://${DOMAIN}/api/auth/discord/callback

      OAUTH_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      OAUTH_DISCORD_CLIENT_SECRET: ${OAUTH2_DISCORD_CLIENT_SECRET}

      VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      VITE_GITHUB_REDIRECT_URI: https://${DOMAIN}/api/auth/github/callback

      OAUTH2_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH2_GITHUB_CLIENT_SECRET: ${OAUTH2_GITHUB_CLIENT_SECRET}

      ALLOWED_HOSTS: ${DOMAIN}
    restart: always

  # --- PROXY REVERSE & SSL AUTOMATIQUE ---
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hackathon-frontend
      - hackathon-backend

  # --- MONITORING ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  discord-bot:
    image: ghcr.io/intriqathon2027/discord-bot:latest
    container_name: discord_bot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      ENV: production
      SUPABASE_HOST: ${SUPABASE_URL}
      SUPABASE_TOKEN: ${SUPABASE_SERVICE_ROLE_KEY}
      BOT_TOKEN: ${BOT_TOKEN}
      DEV_SERVER_ID: ${DEV_SERVER_ID}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID}

  config-app:
    image: ghcr.io/intriqathon2027/configuration-app:latest
    container_name: configuration-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  caddy_data:
  caddy_config:
